
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - TaskPayout</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <nav class="navbar">
    <a href="index.html">Home</a>
    <a href="signup.html">Sign Up</a>
    <a href="login.html">Login</a>
  </nav>

  <div class="auth-container">

    <h1>Welcome Back</h1>

    <p>Login to your TaskPayout account</p>

    <form id="loginForm">

      <input
        type="email"
        name="email"
        id="email"
        placeholder="Email Address"
        autocomplete="email"
        required
      >

      <input
        type="password"
        name="password"
        placeholder="Password"
        autocomplete="current-password"
        required
      >

      <p style="text-align:right; margin:10px 0;">
        <a href="#" id="forgotPassword">
          Forgot Password?
        </a>
      </p>

      <button type="submit" id="loginButton">
        Login
      </button>

      <p id="message" role="status"></p>

    </form>

    <p>
      Don't have an account?
      <a href="signup.html">Sign Up</a>
    </p>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://czimlirfmlsiybuqllsf.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_2rDw4HNQME_r9IK1c7l1tg_1JOnxoBE";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const message = document.getElementById("message");
    const forgotPassword = document.getElementById("forgotPassword");
    const emailInput = document.getElementById("email");

    // NORMAL LOGIN

    loginForm.addEventListener("submit", async function(event) {

      event.preventDefault();

      const email = emailInput.value.trim();
      const password = this.elements.password.value;

      message.textContent = "";
      message.style.color = "red";

      loginButton.disabled = true;
      loginButton.textContent = "Logging in...";

      try {

        const { error } =
          await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });

        if (error) throw error;

        message.style.color = "green";
        message.textContent = "Login successful!";

        window.location.href = "dashboard.html";

      } catch (error) {

        message.style.color = "red";
        message.textContent = error.message;

        loginButton.disabled = false;
        loginButton.textContent = "Login";

      }

    });

    // FORGOT PASSWORD

    forgotPassword.addEventListener("click", async function(event) {

      event.preventDefault();

      const email = emailInput.value.trim();

      if (!email) {
        message.style.color = "red";
        message.textContent =
          "Please enter your email address first.";
        emailInput.focus();
        return;
      }

      forgotPassword.textContent = "Sending...";
      forgotPassword.style.pointerEvents = "none";

      message.textContent = "";

      try {

        const { error } =
          await supabaseClient.auth.resetPasswordForEmail(email, {
            redirectTo:
              "https://taskpayout.netlify.app/reset-password.html"
          });

        if (error) throw error;

        message.style.color = "green";
        message.textContent =
          "Password reset email sent! Check your inbox.";

      } catch (error) {

        message.style.color = "red";
        message.textContent = error.message;

      }

      forgotPassword.textContent = "Forgot Password?";
      forgotPassword.style.pointerEvents = "auto";

    });

  </script>

</body>
</html>
