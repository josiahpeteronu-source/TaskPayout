
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - TaskPayout</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f5ff;
      min-height: 100vh;
      padding: 20px;
    }

    nav {
      background: white;
      padding: 15px;
      text-align: center;
      border-radius: 8px;
      margin-bottom: 25px;
    }

    nav a {
      color: #5545e8;
      text-decoration: none;
      margin: 8px;
      font-weight: bold;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 15px;
      width: 100%;
      max-width: 400px;
      margin: auto;
      box-shadow: 0 4px 15px #00000015;
    }

    h1 {
      text-align: center;
      color: #171d50;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #5545e8;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 15px;
    }

    .signup {
      text-align: center;
      margin-top: 20px;
    }

    .signup a {
      color: #5545e8;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <nav>
    <a href="index.html">Home</a>
    <a href="signup.html">Sign Up</a>
    <a href="login.html">Login</a>
  </nav>

  <div class="container">

    <h1>Welcome Back</h1>

    <p style="text-align:center; color:#666;">
      Login to your TaskPayout account
    </p>

    <form id="loginForm">

      <input
        type="email"
        name="email"
        placeholder="Email Address"
        autocomplete="email"
        required
      >

      <input
        type="password"
        name="password"
        placeholder="Password"
        autocomplete="current-password"
        required
      >

      <button type="submit">Login</button>

    </form>

    <div class="signup">
      Don't have an account?
      <a href="signup.html">Sign Up</a>
    </div>

  </div>

  <script>
    document.getElementById("loginForm")
      .addEventListener("submit", function(event) {
        event.preventDefault();

        alert("Login will work when the secure account system is connected.");
      });
  </script>

</body>
</html>
