
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b2025">

  <title>Sign In - Business Shop</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    :root {
      --dark: #0b2025;
      --dark-light: #142b31;
      --yellow: #f7c52e;
      --aqua: #a9d9d0;
      --blue: #69c7da;
      --white: #f1f7f5;
      --muted: #91a9ad;
      --border: #29434a;
    }

    body {
      background: var(--dark);
      color: var(--white);
      min-height: 100vh;
    }

    .hero {
      min-height: 340px;
      padding: 35px 25px 75px;
      position: relative;
      overflow: hidden;
      background: linear-gradient(145deg, #10313a, #071b21);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 23px;
      font-weight: 800;
      margin-bottom: 48px;
    }

    .brand-dot {
      width: 13px;
      height: 13px;
      background: var(--yellow);
      border-radius: 50%;
    }

    .hero h1 {
      font-size: clamp(32px, 7vw, 43px);
      line-height: 1.13;
      max-width: 500px;
      letter-spacing: -1.3px;
    }

    .hero-tag {
      display: inline-block;
      margin-top: 35px;
      padding: 12px 19px;
      background: var(--yellow);
      color: #17272a;
      border-radius: 30px;
      font-size: 15px;
      font-weight: 600;
      position: relative;
      z-index: 2;
    }

    .wave {
      position: absolute;
      bottom: -1px;
      left: 0;
      width: 100%;
      height: 75px;
      background: var(--aqua);
      clip-path: polygon(
        0 40%, 15% 25%, 30% 36%,
        45% 60%, 60% 55%, 75% 25%,
        90% 30%, 100% 20%, 100% 100%, 0 100%
      );
    }

    .wave::after {
      content: "";
      position: absolute;
      inset: 20px 0 0;
      background: rgba(255,255,255,.25);
    }

    .auth-container {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding: 48px 25px 65px;
    }

    .auth-container h2 {
      font-size: 38px;
      letter-spacing: -1px;
      margin-bottom: 12px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 17px;
      line-height: 1.5;
      margin-bottom: 45px;
    }

    .form-group {
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .input-wrap {
      position: relative;
    }

    input {
      width: 100%;
      padding: 19px 20px;
      background: var(--dark-light);
      border: 2px solid var(--border);
      border-radius: 15px;
      outline: none;
      color: white;
      font-size: 16px;
      transition: .2s;
    }

    input:focus {
      border-color: var(--yellow);
    }

    input::placeholder {
      color: #819196;
    }

    .password-input {
      padding-right: 80px;
    }

    .show-password {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      padding: 8px;
    }

    .form-options {
      display: flex;
      justify-content: flex-end;
      margin: 5px 0 30px;
    }

    a {
      color: var(--blue);
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .submit-btn {
      width: 100%;
      padding: 20px;
      background: var(--yellow);
      color: #17272a;
      border: none;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      transition: .2s;
    }

    .submit-btn:hover {
      filter: brightness(1.05);
    }

    .submit-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      line-height: 1.5;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .signup-text {
      margin-top: 85px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.8;
    }

    .signup-text a {
      margin-left: 4px;
    }

    @media (max-width: 400px) {
      .hero {
        min-height: 315px;
      }

      .auth-container h2 {
        font-size: 33px;
      }

      .subtitle {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <section class="hero">

    <div class="brand">
      <span class="brand-dot"></span>
      Business Shop
    </div>

    <h1>Your business, in your pocket.</h1>

    <div class="hero-tag">
      Discover. Connect. Grow.
    </div>

    <div class="wave"></div>

  </section>

  <main class="auth-container">

    <h2>Sign in</h2>

    <p class="subtitle">
      Welcome back. Your Business Shop account is waiting.
    </p>

    <form id="loginForm">

      <div class="form-group">
        <label for="email">Email address</label>

        <input
          type="email"
          id="email"
          name="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <div class="input-wrap">

          <input
            type="password"
            id="password"
            name="password"
            class="password-input"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >

          <button
            type="button"
            class="show-password"
            id="togglePassword"
            aria-label="Show password"
            aria-pressed="false"
          >
            Show
          </button>

        </div>
      </div>

      <div class="form-options">
        <a href="#" id="forgotPassword">
          Forgot password?
        </a>
      </div>

      <button
        type="submit"
        class="submit-btn"
        id="loginButton"
      >
        Sign in
      </button>

      <p id="message" role="status" aria-live="polite"></p>

    </form>

    <p class="signup-text">
      New to Business Shop?
      <a href="signup.html">Create an account</a>
    </p>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://czimlirfmlsiybuqllsf.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_2rDw4HNQME_r9IK1c7l1tg_1JOnxoBE";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const message = document.getElementById("message");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const forgotPassword = document.getElementById("forgotPassword");
    const togglePassword = document.getElementById("togglePassword");

    function showMessage(text, success = false) {
      message.textContent = text;
      message.style.color = success ? "#a9d9d0" : "#ff8585";
    }

    // SHOW OR HIDE PASSWORD

    togglePassword.addEventListener("click", function() {
      const show = passwordInput.type === "password";

      passwordInput.type = show ? "text" : "password";
      this.textContent = show ? "Hide" : "Show";

      this.setAttribute(
        "aria-label",
        show ? "Hide password" : "Show password"
      );

      this.setAttribute("aria-pressed", String(show));
      passwordInput.focus();
    });

    // NORMAL LOGIN

    loginForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      showMessage("");

      loginButton.disabled = true;
      loginButton.textContent = "Signing in...";

      try {
        const { error } = await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (error) throw error;

        showMessage("Login successful! Opening your dashboard...", true);

        window.location.href = "dashboard.html";

      } catch (error) {
        showMessage(error.message);

        loginButton.disabled = false;
        loginButton.textContent = "Sign in";
      }
    });

    // FORGOT PASSWORD

    forgotPassword.addEventListener("click", async function(event) {
      event.preventDefault();

      const email = emailInput.value.trim();

      if (!email) {
        showMessage("Please enter your email address first.");
        emailInput.focus();
        return;
      }

      forgotPassword.textContent = "Sending...";
      forgotPassword.style.pointerEvents = "none";

      showMessage("");

      try {
        const { error } =
          await supabaseClient.auth.resetPasswordForEmail(email, {
            redirectTo:
              "https://taskpayout.netlify.app/reset-password.html"
          });

        if (error) throw error;

        showMessage(
          "Password reset email sent! Check your inbox.",
          true
        );

      } catch (error) {
        showMessage(error.message);

      } finally {
        forgotPassword.textContent = "Forgot password?";
        forgotPassword.style.pointerEvents = "auto";
      }
    });
  </script>

</body>
</html>
