
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - TaskPayout</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <nav class="navbar">
    <a href="index.html">Home</a>
    <a href="signup.html">Sign Up</a>
    <a href="login.html">Login</a>
  </nav>

  <div class="auth-container">

    <h1>Create Account</h1>
    <p>Join TaskPayout today!</p>

    <form id="signupForm">

      <input type="text" name="fullname"
        placeholder="Full Name" autocomplete="name" required>

      <input type="text" name="username"
        placeholder="Choose a Username"
        autocomplete="username" minlength="3" required>

      <input type="email" name="email"
        placeholder="Email Address" autocomplete="email" required>

      <input type="password" name="password"
        placeholder="Create Password" minlength="8"
        autocomplete="new-password" required>

      <input type="password" name="confirmPassword"
        placeholder="Confirm Password" minlength="8"
        autocomplete="new-password" required>

      <button type="submit">Sign Up</button>

    </form>

    <p>
      Already have an account?
      <a href="login.html">Login</a>
    </p>

    <p style="font-size:12px; margin-top:20px;">
      Never share your password with anyone.
    </p>

  </div>

  <script>
    document.getElementById("signupForm")
      .addEventListener("submit", function(event) {

        event.preventDefault();

        const password = this.elements.password.value;
        const confirmPassword = this.elements.confirmPassword.value;

        if (password !== confirmPassword) {
          alert("Passwords do not match!");
          return;
        }

        alert("Registration will be available when the secure account system is connected.");
      });
  </script>

</body>
</html>
