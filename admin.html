
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - TaskPayout</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f4f5ff;
      font-family: Arial, sans-serif;
      color: #222;
    }

    .admin-container {
      max-width: 1100px;
      margin: 25px auto;
      padding: 15px;
    }

    header { padding: 20px; }

    .admin-card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }

    .admin-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit,minmax(140px,1fr));
      gap: 12px;
      margin-top: 15px;
    }

    .admin-stat {
      background: #f0efff;
      padding: 18px;
      border-radius: 10px;
    }

    .admin-stat h2 {
      color: #5545e8;
      margin-top: 8px;
    }

    .listing {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 16px;
      margin-top: 15px;
      overflow-wrap: anywhere;
    }

    .listing p { margin: 8px 0; }

    button {
      padding: 11px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .approve {
      background: #168b50;
      color: white;
      margin: 8px 5px 0 0;
    }

    .reject {
      background: #d93636;
      color: white;
      margin: 8px 5px 0 0;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .status {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 20px;
      background: #eee;
      font-size: 13px;
    }

    #message {
      padding: 12px;
      margin: 15px 0;
      border-radius: 8px;
      background: #eee;
      overflow-wrap: anywhere;
    }

    .hidden { display: none; }
  </style>
</head>

<body>

<nav class="navbar">
  <a href="index.html">Home</a>
  <a href="dashboard.html">User Dashboard</a>
  <button id="logoutBtn" type="button">Logout</button>
</nav>

<header>
  <h2>TaskPayout Admin</h2>
  <p>Administrator Dashboard</p>
  <p id="adminEmail"></p>
</header>

<main class="admin-container">

  <div id="message">Checking administrator access...</div>

  <section id="adminContent" class="hidden">

    <div class="admin-card">
      <h3>Dashboard Overview</h3>

      <div class="admin-stats">
        <div class="admin-stat">
          <p>Total Listings</p>
          <h2 id="totalListings">0</h2>
        </div>

        <div class="admin-stat">
          <p>Pending Listings</p>
          <h2 id="pendingListings">0</h2>
        </div>

        <div class="admin-stat">
          <p>Approved Listings</p>
          <h2 id="approvedListings">0</h2>
        </div>

        <div class="admin-stat">
          <p>Rejected Listings</p>
          <h2 id="rejectedListings">0</h2>
        </div>
      </div>
    </div>

    <div class="admin-card">
      <h3>All User Submissions</h3>
      <button type="button" id="refreshBtn">Refresh Listings</button>
      <div id="listingsContainer">Loading listings...</div>
    </div>

  </section>
</main>

<script>
  const SUPABASE_URL =
    "https://czimlirfmlsiybuqllsf.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_2rDw4HNQME_r9IK1c7l1tg_1JOnxoBE";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const message = document.getElementById("message");
  const adminContent = document.getElementById("adminContent");
  const listingsContainer =
    document.getElementById("listingsContainer");

  let currentUser = null;

  function showMessage(text) {
    message.textContent = text;
  }

  async function checkAdmin() {
    const { data, error } =
      await supabaseClient.auth.getUser();

    if (error || !data.user) {
      window.location.href = "login.html";
      return;
    }

    currentUser = data.user;

    document.getElementById("adminEmail").textContent =
      "Logged in as: " + currentUser.email;

    const { data: adminRecord, error: adminError } =
      await supabaseClient
        .from("admin_users")
        .select("user_id")
        .eq("user_id", currentUser.id)
        .maybeSingle();

    if (adminError) {
      showMessage("Could not verify admin access: " +
        adminError.message);
      return;
    }

    if (!adminRecord) {
      showMessage(
        "Access denied. Your account is not an administrator."
      );
      return;
    }

    message.classList.add("hidden");
    adminContent.classList.remove("hidden");

    await loadListings();
  }

  async function loadListings() {
    listingsContainer.textContent = "Loading listings...";

    const { data, error } = await supabaseClient
      .from("email_listings")
      .select(
        "id, user_id, email_address, email_provider, description, asking_price, status, created_at"
      )
      .order("created_at", { ascending: false });

    if (error) {
      listingsContainer.textContent =
        "Could not load listings: " + error.message;
      return;
    }

    const listings = data || [];

    document.getElementById("totalListings").textContent =
      listings.length;

    document.getElementById("pendingListings").textContent =
      listings.filter(x => x.status === "pending").length;

    document.getElementById("approvedListings").textContent =
      listings.filter(x => x.status === "approved").length;

    document.getElementById("rejectedListings").textContent =
      listings.filter(x => x.status === "rejected").length;

    listingsContainer.replaceChildren();

    if (listings.length === 0) {
      listingsContainer.textContent = "No listings submitted yet.";
      return;
    }

    listings.forEach(listing => {
      const card = document.createElement("div");
      card.className = "listing";

      const heading = document.createElement("h3");
      heading.textContent = "Listing #" + listing.id;
      card.appendChild(heading);

      function addDetail(label, value) {
        const p = document.createElement("p");
        p.textContent = label + ": " +
          (value === null || value === undefined || value === ""
            ? "Not provided"
            : value);
        card.appendChild(p);
      }

      addDetail("Listing details", listing.description);
      addDetail("Submitted item", listing.email_address);
      addDetail("Category", listing.email_provider);
      addDetail("User ID", listing.user_id);

      const status = document.createElement("p");
      status.className = "status";
      status.textContent = "Status: " + listing.status;
      card.appendChild(status);

      if (listing.status === "pending") {
        const approveBtn = document.createElement("button");
        approveBtn.className = "approve";
        approveBtn.textContent = "Accept";

        approveBtn.addEventListener("click", () => {
          updateListing(listing.id, "approved", approveBtn);
        });

        const rejectBtn = document.createElement("button");
        rejectBtn.className = "reject";
        rejectBtn.textContent = "Reject";

        rejectBtn.addEventListener("click", () => {
          updateListing(listing.id, "rejected", rejectBtn);
        });

        card.appendChild(approveBtn);
        card.appendChild(rejectBtn);
      }

      listingsContainer.appendChild(card);
    });
  }

  async function updateListing(id, newStatus, button) {
    let amount = null;

    if (newStatus === "approved") {
      const entered = prompt(
        "Enter reward amount (₦100 - ₦500):"
      );

      if (entered === null) return;

      amount = Number(entered);

      if (
        !Number.isInteger(amount) ||
        amount < 100 ||
        amount > 500
      ) {
        alert("Enter a whole amount between ₦100 and ₦500.");
        return;
      }
    }

    const confirmed = confirm(
      newStatus === "approved"
        ? "Accept this listing and credit ₦" + amount + "?"
        : "Are you sure you want to reject this listing?"
    );

    if (!confirmed) return;

    const oldText = button.textContent;
    button.disabled = true;
    button.textContent = "Please wait...";

    let error = null;

    if (newStatus === "approved") {
      const result = await supabaseClient.rpc(
        "approve_listing_and_credit",
        {
          p_listing_id: id,
          p_amount: amount
        }
      );

      error = result.error;
    } else {
      const result = await supabaseClient
        .from("email_listings")
        .update({ status: "rejected" })
        .eq("id", id)
        .eq("status", "pending");

      error = result.error;
    }

    if (error) {
      alert("Operation failed: " + error.message);
      button.disabled = false;
      button.textContent = oldText;
      return;
    }

    alert(
      newStatus === "approved"
        ? "Listing accepted and ₦" + amount + " credited."
        : "Listing rejected successfully."
    );

    await loadListings();
  }

  document.getElementById("refreshBtn")
    .addEventListener("click", loadListings);

  document.getElementById("logoutBtn")
    .addEventListener("click", async () => {
      const { error } = await supabaseClient.auth.signOut();

      if (error) {
        alert("Logout failed: " + error.message);
        return;
      }

      window.location.href = "login.html";
    });

  checkAdmin();
</script>

</body>
  </html>
