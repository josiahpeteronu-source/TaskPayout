
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b2025">
<title>Business Shop - Admin Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #f3f7f6;
  color: #172b2d;
}

header {
  background: #0b2025;
  color: white;
  padding: 17px 5%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

header h2 {
  color: #f7c52e;
}

header button,
button {
  border: none;
  border-radius: 8px;
  padding: 12px 16px;
  font-weight: bold;
  cursor: pointer;
}

.logout {
  background: #f7c52e;
  color: #0b2025;
}

.container {
  width: 92%;
  max-width: 1100px;
  margin: 25px auto;
}

.welcome {
  margin-bottom: 22px;
}

.welcome h1 {
  margin-bottom: 8px;
}

.panel {
  background: white;
  padding: 22px;
  border-radius: 14px;
  margin-bottom: 22px;
  box-shadow: 0 3px 15px #0000000d;
}

.panel h2 {
  margin-bottom: 17px;
  color: #0b2025;
}

input,
textarea,
select {
  width: 100%;
  padding: 13px;
  margin: 7px 0 13px;
  border: 1px solid #cbd8d5;
  border-radius: 8px;
  font-size: 15px;
  background: white;
}

textarea {
  min-height: 90px;
  resize: vertical;
}

.primary {
  background: #0b2025;
  color: white;
}

.gold {
  background: #f7c52e;
  color: #0b2025;
}

.danger {
  background: #b42318;
  color: white;
}

.small {
  padding: 8px 11px;
  margin: 4px 3px 4px 0;
  font-size: 12px;
}

.message {
  padding: 13px;
  background: #e8f1ef;
  border-radius: 8px;
  margin-bottom: 18px;
  overflow-wrap: anywhere;
}

.product,
.order {
  border: 1px solid #e0e8e5;
  border-radius: 11px;
  padding: 15px;
  margin: 12px 0;
  overflow-wrap: anywhere;
}

.product img {
  width: 100%;
  max-width: 180px;
  height: 140px;
  object-fit: cover;
  border-radius: 8px;
  display: block;
  margin-bottom: 12px;
  background: #edf2f0;
}

.product h3,
.order h3 {
  margin-bottom: 8px;
}

.muted {
  color: #647575;
  font-size: 13px;
  margin: 6px 0;
}

.status {
  display: inline-block;
  background: #e8f1ef;
  padding: 6px 10px;
  border-radius: 20px;
  font-size: 12px;
  margin: 6px 0;
}

.hidden {
  display: none;
}

hr {
  border: none;
  border-top: 1px solid #e5ece9;
  margin: 13px 0;
}

@media (min-width: 700px) {
  .product-list {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }
}
</style>
</head>

<body>

<header>
  <h2>Business Shop</h2>
  <button class="logout" id="logoutBtn">Logout</button>
</header>

<main class="container">

  <div class="welcome">
    <h1>Admin Dashboard</h1>
    <p>Manage your products and customer orders.</p>
  </div>

  <div id="message" class="message">
    Connecting to Business Shop...
  </div>

  <section id="adminContent" class="hidden">

    <div class="panel">
      <h2 id="formTitle">Add New Product</h2>

      <form id="productForm">
        <label>Product Name</label>
        <input id="productName" type="text" placeholder="Enter product name" required>

        <label>Product Price (₦)</label>
        <input id="productPrice" type="number" min="0" step="0.01" placeholder="Enter price" required>

        <label>Product Description</label>
        <textarea id="productDescription" placeholder="Describe your product"></textarea>

        <label>Product Image</label>
        <input id="productImage" type="file" accept="image/jpeg,image/png,image/webp">

        <button type="submit" class="primary" id="saveProductBtn">Post Product</button>
        <button type="button" class="gold hidden" id="cancelEditBtn">Cancel Edit</button>
      </form>
    </div>

    <div class="panel">
      <h2>Store Products</h2>
      <button class="primary" id="refreshProductsBtn">Refresh Products</button>
      <div id="productsList"></div>
    </div>

    <div class="panel">
      <h2>Customer Orders</h2>
      <button class="primary" id="refreshOrdersBtn">Refresh Orders</button>
      <div id="ordersList"></div>
    </div>

  </section>
</main>

<script>
const SUPABASE_URL = "https://czimlirfmlsiybuqllsf.supabase.co";

const SUPABASE_KEY = "sb_publishable_2rDw4HNQME_r9IK1c7l1tg_1JOnxoBE";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const message = document.getElementById("message");
const adminContent = document.getElementById("adminContent");

let currentUser = null;
let editingProductId = null;

function showMessage(text) {
  message.textContent = text;
}

function formatMoney(amount) {
  return "₦" + Number(amount || 0).toLocaleString("en-NG", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
}

// LOGOUT
document.getElementById("logoutBtn").addEventListener("click", async () => {
  const button = document.getElementById("logoutBtn");
  button.disabled = true;
  button.textContent = "Logging out...";

  const { error } = await db.auth.signOut();

  if (error) {
    showMessage("Logout failed: " + error.message);
    button.disabled = false;
    button.textContent = "Logout";
    return;
  }

  window.location.replace("login.html");
});

// VERIFY ADMIN
async function checkAdmin() {
  try {
    showMessage("Checking administrator access...");

    const { data: sessionData, error: sessionError } =
      await db.auth.getSession();

    if (sessionError) throw sessionError;

    const session = sessionData.session;

    if (!session) {
      window.location.replace("login.html");
      return;
    }

    currentUser = session.user;

    const { data: adminRecord, error: adminError } = await db
      .from("admin_users")
      .select("user_id")
      .eq("user_id", currentUser.id)
      .maybeSingle();

    if (adminError) throw adminError;

    if (!adminRecord) {
      showMessage("Access denied. This account is not an administrator.");
      await db.auth.signOut();
      return;
    }

    showMessage("Administrator verified. Welcome to Business Shop.");

    adminContent.classList.remove("hidden");

    await loadProducts();
    await loadOrders();

  } catch (error) {
    console.error(error);
    showMessage("Error checking admin access: " + error.message);
  }
}

// RESET PRODUCT FORM
function resetProductForm() {
  editingProductId = null;
  document.getElementById("productForm").reset();
  document.getElementById("formTitle").textContent = "Add New Product";
  document.getElementById("saveProductBtn").textContent = "Post Product";
  document.getElementById("cancelEditBtn").classList.add("hidden");
}

// UPLOAD IMAGE
async function uploadProductImage(file) {
  if (!file) return null;

  const allowedTypes = ["image/jpeg", "image/png", "image/webp"];

  if (!allowedTypes.includes(file.type)) {
    throw new Error("Please select a JPG, PNG or WebP image.");
  }

  if (file.size > 5 * 1024 * 1024) {
    throw new Error("Image must be smaller than 5 MB.");
  }

  const extension = file.name.split(".").pop().toLowerCase();
  const fileName = currentUser.id + "/" + Date.now() + "." + extension;

  const { error } = await db.storage
    .from("store-products")
    .upload(fileName, file, {
      upsert: false,
      contentType: file.type
    });

  if (error) throw error;

  const { data } = db.storage
    .from("store-products")
    .getPublicUrl(fileName);

  return data.publicUrl;
}

// ADD OR EDIT PRODUCT
document.getElementById("productForm").addEventListener("submit", async (event) => {
  event.preventDefault();

  const saveButton = document.getElementById("saveProductBtn");
  saveButton.disabled = true;
  saveButton.textContent = "Saving...";

  try {
    const name = document.getElementById("productName").value.trim();
    const price = Number(document.getElementById("productPrice").value);
    const description = document.getElementById("productDescription").value.trim();
    const file = document.getElementById("productImage").files[0];

    if (!name || !Number.isFinite(price) || price < 0) {
      throw new Error("Enter a valid product name and price.");
    }

    const productData = {
      name,
      price,
      description
    };

    if (file) {
      productData.image_url = await uploadProductImage(file);
    }

    let result;

    if (editingProductId) {
      result = await db
        .from("store_products")
        .update(productData)
        .eq("id", editingProductId);
    } else {
      result = await db
        .from("store_products")
        .insert(productData);
    }

    if (result.error) throw result.error;

    showMessage(editingProductId ? "Product updated successfully." : "Product posted successfully.");

    resetProductForm();
    await loadProducts();

  } catch (error) {
    showMessage("Product error: " + error.message);
  } finally {
    saveButton.disabled = false;
    saveButton.textContent = editingProductId ? "Update Product" : "Post Product";
  }
});

document.getElementById("cancelEditBtn").addEventListener("click", resetProductForm);

// LOAD PRODUCTS
async function loadProducts() {
  const list = document.getElementById("productsList");
  list.textContent = "Loading products...";

  const { data, error } = await db
    .from("store_products")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    list.textContent = "Could not load products: " + error.message;
    return;
  }

  if (!data || data.length === 0) {
    list.textContent = "No products have been posted yet.";
    return;
  }

  list.innerHTML = "";

  data.forEach(product => {
    const card = document.createElement("div");
    card.className = "product";

    if (product.image_url) {
      const image = document.createElement("img");
      image.src = product.image_url;
      image.alt = product.name;
      card.appendChild(image);
    }

    const title = document.createElement("h3");
    title.textContent = product.name;
    card.appendChild(title);

    const price = document.createElement("p");
    price.textContent = formatMoney(product.price);
    card.appendChild(price);

    const description = document.createElement("p");
    description.className = "muted";
    description.textContent = product.description || "No description";
    card.appendChild(description);

    const visibility = document.createElement("p");
    visibility.className = "status";
    visibility.textContent = product.is_active ? "Visible in store" : "Hidden from store";
    card.appendChild(visibility);

    const editButton = document.createElement("button");
    editButton.className = "gold small";
    editButton.textContent = "Edit";
    editButton.addEventListener("click", () => editProduct(product));
    card.appendChild(editButton);

    const toggleButton = document.createElement("button");
    toggleButton.className = "primary small";
    toggleButton.textContent = product.is_active ? "Hide Product" : "Show Product";
    toggleButton.addEventListener("click", () => toggleProduct(product));
    card.appendChild(toggleButton);

    const deleteButton = document.createElement("button");
    deleteButton.className = "danger small";
    deleteButton.textContent = "Delete";
    deleteButton.addEventListener("click", () => deleteProduct(product));
    card.appendChild(deleteButton);

    list.appendChild(card);
  });
}

// EDIT PRODUCT
function editProduct(product) {
  editingProductId = product.id;

  document.getElementById("productName").value = product.name;
  document.getElementById("productPrice").value = product.price;
  document.getElementById("productDescription").value = product.description || "";
  document.getElementById("productImage").value = "";

  document.getElementById("formTitle").textContent = "Edit Product";
  document.getElementById("saveProductBtn").textContent = "Update Product";
  document.getElementById("cancelEditBtn").classList.remove("hidden");

  window.scrollTo({ top: 0, behavior: "smooth" });
}

// HIDE OR SHOW PRODUCT
async function toggleProduct(product) {
  const { error } = await db
    .from("store_products")
    .update({ is_active: !product.is_active })
    .eq("id", product.id);

  if (error) {
    showMessage("Could not update product: " + error.message);
    return;
  }

  showMessage("Product visibility updated.");
  await loadProducts();
}

// DELETE PRODUCT
async function deleteProduct(product) {
  if (!confirm("Are you sure you want to delete " + product.name + "?")) return;

  const { error } = await db
    .from("store_products")
    .delete()
    .eq("id", product.id);

  if (error) {
    showMessage("Could not delete product: " + error.message);
    return;
  }

  showMessage("Product deleted successfully.");
  await loadProducts();
}

// LOAD ORDERS
async function loadOrders() {
  const list = document.getElementById("ordersList");
  list.textContent = "Loading customer orders...";

  const { data: orders, error } = await db
    .from("store_orders")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    list.textContent = "Could not load orders: " + error.message;
    return;
  }

  if (!orders || orders.length === 0) {
    list.textContent = "No customer orders yet.";
    return;
  }

  list.innerHTML = "";

  for (const order of orders) {
    const card = document.createElement("div");
    card.className = "order";

    const title = document.createElement("h3");
    title.textContent = "Order #" + order.id;
    card.appendChild(title);

    const details = [
      "Customer: " + order.customer_name,
      "Email: " + order.customer_email,
      "Phone: " + order.customer_phone,
      "Delivery address: " + order.delivery_address,
      "Total: " + formatMoney(order.total_amount),
      "Date: " + new Date(order.created_at).toLocaleString()
    ];

    details.forEach(detail => {
      const p = document.createElement("p");
      p.className = "muted";
      p.textContent = detail;
      card.appendChild(p);
    });

    const status = document.createElement("p");
    status.className = "status";
    status.textContent = "Status: " + order.status;
    card.appendChild(status);

    const itemHeading = document.createElement("h4");
    itemHeading.textContent = "Ordered Products";
    card.appendChild(itemHeading);

    const { data: items, error: itemsError } = await db
      .from("store_order_items")
      .select("*")
      .eq("order_id", order.id);

    if (itemsError) {
      const errorText = document.createElement("p");
      errorText.className = "muted";
      errorText.textContent = "Could not load order items: " + itemsError.message;
      card.appendChild(errorText);
    } else if (items && items.length) {
      items.forEach(item => {
        const p = document.createElement("p");
        p.className = "muted";
        p.textContent = item.product_name + " × " + item.quantity +
          " — " + formatMoney(item.subtotal);
        card.appendChild(p);
      });
    } else {
      const p = document.createElement("p");
      p.className = "muted";
      p.textContent = "No order items found.";
      card.appendChild(p);
    }

    const statusSelect = document.createElement("select");

    ["pending", "confirmed", "shipped", "delivered", "cancelled"].forEach(value => {
      const option = document.createElement("option");
      option.value = value;
      option.textContent = value.charAt(0).toUpperCase() + value.slice(1);
      statusSelect.appendChild(option);
    });

    statusSelect.value = order.status;
    card.appendChild(statusSelect);

    const updateButton = document.createElement("button");
    updateButton.className = "primary small";
    updateButton.textContent = "Update Order Status";

    updateButton.addEventListener("click", async () => {
      updateButton.disabled = true;
      updateButton.textContent = "Updating...";

      const { error: updateError } = await db
        .from("store_orders")
        .update({ status: statusSelect.value })
        .eq("id", order.id);

      if (updateError) {
        showMessage("Order update failed: " + updateError.message);
      } else {
        showMessage("Order #" + order.id + " updated successfully.");
        await loadOrders();
      }

      updateButton.disabled = false;
      updateButton.textContent = "Update Order Status";
    });

    card.appendChild(updateButton);
    list.appendChild(card);
  }
}

// REFRESH BUTTONS
document.getElementById("refreshProductsBtn").addEventListener("click", loadProducts);
document.getElementById("refreshOrdersBtn").addEventListener("click", loadOrders);

// START ADMIN CHECK
checkAdmin();

</script>
</body>
</html>
