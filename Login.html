
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Email Earn</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f5ff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 15px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 15px #00000015;
    }

    h1 {
      text-align: center;
      color: #171d50;
    }

    p {
      text-align: center;
      color: #666;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 12px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #5545e8;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 15px;
    }

    button:hover {
      background: #3025b5;
    }

    a {
      color: #5545e8;
      text-decoration: none;
    }

    .signup {
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Welcome Back!</h1>
    <p>Login to your Email Earn account</p>

    <form id="loginForm">

      <input
        type="email"
        placeholder="Email Address"
        required
      >

      <input
        type="password"
        placeholder="Password"
        required
      >

      <button type="submit">Login</button>

    </form>

    <div class="signup">
      Don't have an account?
      <a href="signup.html">Create Account</a>
    </div>

    <p style="font-size:12px;">
      Keep your account password private.
    </p>

  </div>

  <script>
    document.getElementById("loginForm")
      .addEventListener("submit", function(event) {
        event.preventDefault();
        alert("Login will work after we connect the secure account system.");
      });
  </script>

</body>
</html>
